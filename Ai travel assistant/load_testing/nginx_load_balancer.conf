# ═══════════════════════════════════════════════════════════════════════════
# AEVORA / TravelIQ - Production Nginx Reverse Proxy & Load Balancer Config
# ═══════════════════════════════════════════════════════════════════════════

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Buffering & I/O
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # Rate Limiting Zones (Token Bucket for DDoS / Brute Force Prevention)
    limit_req_zone $binary_remote_addr zone=api_general_limit:20m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=auth_sensitive_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=per_ip_conn_limit:10m;

    # Upstream Backend Pool (3 Node Instances)
    upstream aevora_backend_cluster {
        # Least connections distribution ensures traffic flows to the least loaded server
        least_conn;

        server backend-1:5000 max_fails=3 fail_timeout=10s;
        server backend-2:5000 max_fails=3 fail_timeout=10s;
        server backend-3:5000 max_fails=3 fail_timeout=10s;

        # Keepalive connections to upstreams avoid TCP 3-way handshake on every request
        keepalive 64;
    }

    # Upstream AI Microservice Cluster
    upstream aevora_ai_cluster {
        least_conn;
        server ai-service-1:8000 max_fails=3 fail_timeout=10s;
        server ai-service-2:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 10M;
        limit_conn per_ip_conn_limit 50;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Load-Balancer "Aevora-Nginx-Cluster" always;

        # Deny access to hidden dotfiles (.env, .git, etc.)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        # Health check endpoint for external cloud load balancer (AWS ALB / Cloudflare)
        location /lb-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Auth & Sensitive Endpoints Rate Limiting
        location ~ ^/api/auth/(login|register|reset-password) {
            limit_req zone=auth_sensitive_limit burst=15 nodelay;

            proxy_pass http://aevora_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }

        # Backend API Routing
        location /api/ {
            limit_req zone=api_general_limit burst=40 nodelay;

            proxy_pass http://aevora_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Automatic failover: if an instance dies or times out, re-route to another
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # Static User Avatars
        location /uploads/avatars/ {
            proxy_pass http://aevora_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Frontend Client SPA
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff)$ {
                expires 1y;
                access_log off;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
